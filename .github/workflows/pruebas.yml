name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: pruebas
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Reglas de Firebase (economía y antitrampas)
        working-directory: pruebas
        run: node reglas.test.js
      - name: Prueba de humo en el navegador
        working-directory: pruebas
        run: node humo.test.js
      - name: Racha diaria de punta a punta (juego + reglas reales)
        working-directory: pruebas
        run: node racha.test.js
      - name: Las reglas coinciden con el catálogo (tienda.js)
        run: |
          cp firebase-rules.json /tmp/reglas-antes.json
          node herramientas/generar-reglas.js
          diff -q firebase-rules.json /tmp/reglas-antes.json
